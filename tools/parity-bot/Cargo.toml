[package]
name = "parity-bot"
version = "0.1.0"
edition = "2024"
publish = false
description = "Headless 26.2 client that keeps a player in simulation range of a Pumpkin server and records what it observes, so behaviour can be checked live instead of only by reading the decompile."

[dependencies]
azalea = { git = "https://github.com/azalea-rs/azalea", rev = "ffedf17c9b6ff9fbafbf7e0d14c8d2366b2d0a32" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

services:
  pumpkinpie:
    # Build this fork locally. Published images belong under ghcr.io/eshankiyer/pumpkinpie.
    build: .
    ports:
      - "25565:25565"
    volumes:
      - ./data:/pumpkinpie
      # Use the following, if you want to make your config immutable
      #- ./config:/pumpkinpie/config:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    read_only: true

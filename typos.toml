[files]
extend-exclude = ["assets/", "crates/pumpkin-data/src/generated", "tools/conformance/*.json"]

[default.extend-words]
handled = "handled"
received = "received"
ba = "ba"
fo = "fo"
undescore = "undescore"
replaceables = "replaceables"
# Mojang's own spelling: `Goal.isInterruptable` (verified in Goal.java:18). Doc comments cite
# vanilla method names verbatim, so correcting this to "Interruptible" would falsify the citation.
Interruptable = "Interruptable"
# Mojang's decompiled method names: these identifiers are intentionally preserved verbatim
# in source citations for vanilla parity.
Activites = "Activites"
Neigbour = "Neigbour"
Mergable = "Mergable"
# `ThrownTrident.isAcceptibleReturnOwner` (verified at ThrownTrident.java:99). Correcting the
# spelling here would falsify a citation of a real vanilla method name.
Acceptible = "Acceptible"
# Mojang's own spelling: `IronBarsBlock.attachsTo` (verified at IronBarsBlock.java:101).
# Correcting this to "attaches" would falsify a citation of a real vanilla method name.
attachs = "attachs"
# Mojang's own spelling: `BlockTags.CONVERTABLE_TO_MUD` (verified at BlockTags.java:187,
# `data/minecraft/tags/block/convertable_to_mud.json`). This is the generated constant's
# real registry id, not a typo to fix.
CONVERTABLE = "CONVERTABLE"
# Mojang's own spelling: `FunctionCommand.ERROR_FUNCTION_INSTANTATION_FAILURE` (verified at
# FunctionCommand.java:49). Correcting this to "INSTANTIATION" would falsify a citation of a
# real vanilla constant name.
INSTANTATION = "INSTANTATION"
